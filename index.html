<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GENOMICA V1.0 - Analizador Genómico & Vahaduo G25</title>
    <meta name="description" content="GENOMICA V1.0: Analizador genómico local de SNP y suite Vahaduo G25 completa." />
    <!-- Circle Emblem Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23ffffff' stroke='%23000000' stroke-width='6'/%3E%3Ccircle cx='50' cy='50' r='16' fill='%23000000'/%3E%3C/svg%3E" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('app_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
